services:
  mysql:
    image: mysql:8.0
    container_name: healthyhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_local_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healthyhub}
      MYSQL_USER: ${MYSQL_USER:-healthyhub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local_password}
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - healthyhub_mysql_data:/var/lib/mysql
      - ./database/schemas:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - healthyhub-network

  api:
    container_name: healthyhub-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-HealthyHub}
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
      APP_URL: ${APP_URL:?APP_URL is required}
      API_PORT: ${API_PORT:?API_PORT is required}
      API_PREFIX: ${API_PREFIX:-/api/v1}
      API_DOCS_PATH: ${API_DOCS_PATH:-/api/docs}
      CONTRACT_VERSION: ${CONTRACT_VERSION:-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:?AUTH_ALLOWED_ORIGINS is required}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1mb}
      RATE_LIMIT_TTL_MS: ${RATE_LIMIT_TTL_MS:-60000}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_REDACTION_KEYS: ${LOG_REDACTION_KEYS:-password,token,authorization,cookie,secret,apiKey}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-healthyhub}
      MYSQL_USER: ${MYSQL_USER:-healthyhub_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local_password}
      TYPEORM_SYNCHRONIZE: 'false'
      TYPEORM_LOGGING: ${TYPEORM_LOGGING:-false}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-not_configured}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-}
      VNPAY_API_URL: ${VNPAY_API_URL:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
    ports:
      - '${API_PORT:?API_PORT is required}:${API_PORT:?API_PORT is required}'
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:' + process.env.API_PORT + '/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - healthyhub-network

  web:
    container_name: healthyhub-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-HealthyHub}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    environment:
      WEB_PORT: ${WEB_PORT:?WEB_PORT is required}
      VITE_APP_NAME: ${VITE_APP_NAME:-HealthyHub}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    ports:
      - '${WEB_PORT:?WEB_PORT is required}:${WEB_PORT:?WEB_PORT is required}'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:' + process.env.WEB_PORT).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - healthyhub-network

  phpmyadmin:
    image: phpmyadmin:5
    container_name: healthyhub-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_local_root_password}
    ports:
      - '${PHPMYADMIN_PORT:-8080}:80'
    healthcheck:
      test:
        ['CMD-SHELL', 'php -r ''exit(@file_get_contents("http://127.0.0.1/") === false ? 1 : 0);''']
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - healthyhub-network

volumes:
  healthyhub_mysql_data:

networks:
  healthyhub-network:
    driver: bridge
