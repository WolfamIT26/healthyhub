name: CI

on:
  push:
  pull_request:

jobs:
  foundation-check:
    name: Implementation Foundation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Documentation Check
        run: npm run docs:check

      - name: OpenAPI Check
        run: npm run openapi:validate

      - name: Secret Scan
        run: npm run secrets:check
