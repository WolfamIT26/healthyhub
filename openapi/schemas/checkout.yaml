ShippingQuoteRequest:
  type: object
  additionalProperties: false
  required: [address, shippingMethod]
  properties:
    address: { $ref: "./order.yaml#/OrderShippingAddressRequest" }
    shippingMethod: { type: string, const: manual }
ShippingQuote:
  type: object
  additionalProperties: false
  required: [quoteReference, methodCode, methodName, shippingFee, currency, available, estimatedDelivery, addressSnapshot]
  properties:
    quoteReference: { type: string }
    methodCode: { type: string, const: manual }
    methodName: { type: string }
    shippingFee: { type: string, pattern: "^[0-9]+\\.[0-9]{2}$" }
    currency: { type: string, const: VND }
    available: { type: boolean, const: true }
    estimatedDelivery: { type: "null" }
    addressSnapshot: { $ref: "#/ShippingAddressSnapshot" }
ShippingAddressSnapshot:
  type: object
  additionalProperties: false
  required: [recipientName, phone, countryCode, provinceCity, district, ward, addressLine, note]
  properties:
    recipientName: { type: string }
    phone: { type: string }
    countryCode: { type: string, const: VN }
    provinceCity: { type: string }
    district: { type: string }
    ward: { type: [string, "null"] }
    addressLine: { type: string }
    note: { type: [string, "null"] }
ShippingQuoteResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/ShippingQuote" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
