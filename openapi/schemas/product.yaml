ProductFilterOption:
  type: object
  additionalProperties: false
  required: [id, slug, name]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
    name: { type: string }
ProductNutrition:
  type: [object, "null"]
  additionalProperties: false
  required: [servingSize, calories, protein, carbohydrates, fat, sugar, note]
  properties:
    servingSize: { type: [string, "null"] }
    calories: { type: [string, "null"] }
    protein: { type: [string, "null"] }
    carbohydrates: { type: [string, "null"] }
    fat: { type: [string, "null"] }
    sugar: { type: [string, "null"] }
    note: { type: [string, "null"] }
ProductIngredient:
  type: object
  additionalProperties: false
  required: [name, description, nutritionNote]
  properties:
    name: { type: string }
    description: { type: [string, "null"] }
    nutritionNote: { type: [string, "null"] }
ProductMedia:
  type: object
  additionalProperties: false
  required: [id, url, role, label]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    url: { type: string }
    role: { type: string }
    label: { type: string }
PublicProduct:
  type: object
  additionalProperties: false
  required:
    - id
    - slug
    - sku
    - name
    - shortDescription
    - description
    - usageNote
    - storageNote
    - category
    - brand
    - price
    - currency
    - availability
    - sellable
    - featured
    - dietaryTags
    - ingredients
    - allergenInformation
    - nutrition
    - media
    - createdAt
    - updatedAt
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
    sku: { type: string }
    name: { type: string }
    shortDescription: { type: string }
    description: { type: [string, "null"] }
    usageNote: { type: [string, "null"] }
    storageNote: { type: [string, "null"] }
    category: { $ref: "#/ProductFilterOption" }
    brand:
      oneOf:
        - { $ref: "#/ProductFilterOption" }
        - { type: "null" }
    price: { type: string, pattern: "^[0-9]+\.[0-9]{2}$" }
    currency: { type: string, const: VND }
    availability:
      type: string
      enum: [in_stock, low_stock, out_of_stock, unavailable]
    sellable: { type: boolean }
    featured: { type: boolean }
    dietaryTags:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [low-sugar, sugar-free, high-protein, vegan, vegetarian, lactose-free, gluten-free, organic]
    ingredients:
      type: array
      items: { $ref: "#/ProductIngredient" }
    allergenInformation:
      type: array
      uniqueItems: true
      items: { type: string }
    nutrition: { $ref: "#/ProductNutrition" }
    media:
      type: array
      items: { $ref: "#/ProductMedia" }
    createdAt: { type: string, format: date-time }
    updatedAt: { type: string, format: date-time }
PublicProductDetail:
  allOf:
    - { $ref: "#/PublicProduct" }
    - type: object
      additionalProperties: false
      required: [relatedProducts]
      properties:
        relatedProducts:
          type: array
          maxItems: 4
          items: { $ref: "#/PublicProduct" }
PublicProductList:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, totalItems, totalPages]
  properties:
    items:
      type: array
      items: { $ref: "#/PublicProduct" }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 60 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
PublicProductOptions:
  type: object
  additionalProperties: false
  required: [categories, brands, dietary]
  properties:
    categories:
      type: array
      items: { $ref: "#/ProductFilterOption" }
    brands:
      type: array
      items: { $ref: "#/ProductFilterOption" }
    dietary:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [low-sugar, sugar-free, high-protein, vegan, vegetarian, lactose-free, gluten-free, organic]
PublicCategory:
  type: object
  additionalProperties: false
  required: [id, slug, name, description, displayOrder, parent]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
    name: { type: string }
    description: { type: [string, "null"] }
    displayOrder: { type: integer, minimum: 0 }
    parent:
      oneOf:
        - { $ref: "#/ProductFilterOption" }
        - { type: "null" }
PublicCategoryTreeNode:
  allOf:
    - { $ref: "#/PublicCategory" }
    - type: object
      additionalProperties: false
      required: [children]
      properties:
        children:
          type: array
          items: { $ref: "#/PublicCategoryTreeNode" }
PublicBrand:
  type: object
  additionalProperties: false
  required: [id, slug, name, origin, description]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
    name: { type: string }
    origin: { type: [string, "null"] }
    description: { type: [string, "null"] }
PublicCategoryList:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, totalItems, totalPages]
  properties:
    items:
      type: array
      items: { $ref: "#/PublicCategory" }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 60 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
PublicBrandList:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, totalItems, totalPages]
  properties:
    items:
      type: array
      items: { $ref: "#/PublicBrand" }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 60 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
ProductListResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicProductList" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
ProductDetailResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicProductDetail" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
ProductOptionsResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicProductOptions" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
CategoryListResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicCategoryList" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
CategoryTreeResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data:
      type: array
      items: { $ref: "#/PublicCategoryTreeNode" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
CategoryDetailResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicCategory" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
BrandListResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicBrandList" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
BrandDetailResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/PublicBrand" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
AdminProductRelationOption:
  type: object
  additionalProperties: false
  required: [id, name, slug]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    name: { type: string }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
AdminProductListItem:
  type: object
  additionalProperties: false
  required: [id, sku, name, slug, price, productStatus, visibility, sellableStatus, availability, featured, brand, primaryCategory, updatedAt, version]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    sku: { type: string, minLength: 2, maxLength: 64 }
    name: { type: string, minLength: 1, maxLength: 255 }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 191 }
    price: { type: string, pattern: "^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$" }
    productStatus: { type: string, enum: [draft, active, discontinued] }
    visibility: { type: string, enum: [public, hidden, private] }
    sellableStatus: { type: string, enum: [sellable, out_of_stock, preorder, unavailable] }
    availability: { type: string, enum: [in_stock, low_stock, out_of_stock, unavailable] }
    featured: { type: boolean }
    brand:
      oneOf:
        - { $ref: "#/AdminProductRelationOption" }
        - { type: "null" }
    primaryCategory:
      oneOf:
        - { $ref: "#/AdminProductRelationOption" }
        - { type: "null" }
    updatedAt: { type: string, format: date-time }
    version: { type: integer, minimum: 1 }
AdminProductContent:
  type: object
  additionalProperties: false
  required: [description, summary, usageNote, storageNote, seoTitle, seoDescription, status]
  properties:
    description: { type: string, minLength: 3, maxLength: 10000 }
    summary: { type: [string, "null"], maxLength: 500 }
    usageNote: { type: [string, "null"], maxLength: 2000 }
    storageNote: { type: [string, "null"], maxLength: 2000 }
    seoTitle: { type: [string, "null"], maxLength: 255 }
    seoDescription: { type: [string, "null"], maxLength: 500 }
    status: { type: string, enum: [draft, review, published] }
AdminProductNutritionInput:
  type: [object, "null"]
  additionalProperties: false
  required: [servingSize, calories, protein, carbohydrates, fat, sugar, note]
  properties:
    servingSize: { type: [string, "null"], maxLength: 100 }
    calories: { type: [string, "null"], maxLength: 100 }
    protein: { type: [string, "null"], maxLength: 100 }
    carbohydrates: { type: [string, "null"], maxLength: 100 }
    fat: { type: [string, "null"], maxLength: 100 }
    sugar: { type: [string, "null"], maxLength: 100 }
    note: { type: [string, "null"], maxLength: 500 }
AdminProductIngredientInput:
  type: object
  additionalProperties: false
  required: [name, description, nutritionNote, allergyWarning]
  properties:
    name: { type: string, minLength: 1, maxLength: 255 }
    description: { type: [string, "null"], maxLength: 2000 }
    nutritionNote: { type: [string, "null"], maxLength: 2000 }
    allergyWarning: { type: [string, "null"], maxLength: 500 }
AdminProductMediaInput:
  type: object
  additionalProperties: false
  required: [mediaAssetId, role]
  properties:
    mediaAssetId: { type: string, pattern: "^[1-9][0-9]*$" }
    role: { type: string, enum: [main, gallery, nutrition] }
AdminProductAggregateRequest:
  type: object
  required: [name, slug, price, brandId, categoryIds, primaryCategoryId, featured, content, nutrition, ingredients, dietaryTags, media]
  properties:
    name: { type: string, minLength: 1, maxLength: 255 }
    slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 191 }
    price: { type: string, pattern: "^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$" }
    brandId: { type: [string, "null"], pattern: "^[1-9][0-9]*$" }
    categoryIds:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items: { type: string, pattern: "^[1-9][0-9]*$" }
    primaryCategoryId: { type: string, pattern: "^[1-9][0-9]*$" }
    featured: { type: boolean }
    content: { $ref: "#/AdminProductContent" }
    nutrition: { $ref: "#/AdminProductNutritionInput" }
    ingredients:
      type: array
      maxItems: 50
      items: { $ref: "#/AdminProductIngredientInput" }
    dietaryTags:
      type: array
      uniqueItems: true
      items: { type: string, enum: [low-sugar, sugar-free, high-protein, vegan, vegetarian, lactose-free, gluten-free, organic] }
    media:
      type: array
      maxItems: 20
      items: { $ref: "#/AdminProductMediaInput" }
AdminCreateProductRequest:
  allOf:
    - { $ref: "#/AdminProductAggregateRequest" }
    - type: object
      required: [sku]
      properties:
        sku: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$" }
  unevaluatedProperties: false
AdminUpdateProductRequest:
  allOf:
    - { $ref: "#/AdminProductAggregateRequest" }
    - type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
  unevaluatedProperties: false
AdminProductStatusRequest:
  type: object
  additionalProperties: false
  required: [productStatus, visibility, version]
  properties:
    productStatus: { type: string, enum: [draft, active, discontinued] }
    visibility: { type: string, enum: [public, hidden, private] }
    version: { type: integer, minimum: 1 }
AdminProductCategory:
  allOf:
    - { $ref: "#/AdminProductRelationOption" }
    - type: object
      required: [primary, visibility]
      properties:
        primary: { type: boolean }
        visibility: { type: string, enum: [public, private] }
AdminProductMediaRelation:
  type: object
  additionalProperties: false
  required: [mediaAssetId, name, role, displayOrder, visibility, previewUrl]
  properties:
    mediaAssetId: { type: string, pattern: "^[1-9][0-9]*$" }
    name: { type: string }
    role: { type: string, enum: [main, gallery, nutrition] }
    displayOrder: { type: integer, minimum: 0 }
    visibility: { type: string, enum: [public, private, restricted] }
    previewUrl: { type: [string, "null"], format: uri }
AdminProductDetail:
  allOf:
    - { $ref: "#/AdminProductListItem" }
    - type: object
      required: [categories, content, nutrition, ingredients, dietaryTags, media, createdAt]
      properties:
        categories:
          type: array
          items: { $ref: "#/AdminProductCategory" }
        content: { $ref: "#/AdminProductContent" }
        nutrition: { $ref: "#/AdminProductNutritionInput" }
        ingredients:
          type: array
          items: { $ref: "#/AdminProductIngredientInput" }
        dietaryTags:
          type: array
          uniqueItems: true
          items: { type: string, enum: [low-sugar, sugar-free, high-protein, vegan, vegetarian, lactose-free, gluten-free, organic] }
        media:
          type: array
          items: { $ref: "#/AdminProductMediaRelation" }
        createdAt: { type: string, format: date-time }
  unevaluatedProperties: false
AdminProductMediaOption:
  type: object
  additionalProperties: false
  required: [id, name, visibility, previewUrl]
  properties:
    id: { type: string, pattern: "^[1-9][0-9]*$" }
    name: { type: string }
    visibility: { type: string, enum: [public, private, restricted] }
    previewUrl: { type: [string, "null"], format: uri }
AdminProductOptions:
  type: object
  additionalProperties: false
  required: [categories, brands, dietaryTags, media]
  properties:
    categories:
      type: array
      items:
        allOf:
          - { $ref: "#/AdminProductRelationOption" }
          - type: object
            required: [visibility]
            properties:
              visibility: { type: string, enum: [public, private] }
    brands:
      type: array
      items: { $ref: "#/AdminProductRelationOption" }
    dietaryTags:
      type: array
      uniqueItems: true
      items: { type: string, enum: [low-sugar, sugar-free, high-protein, vegan, vegetarian, lactose-free, gluten-free, organic] }
    media:
      type: array
      items: { $ref: "#/AdminProductMediaOption" }
AdminProductList:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, totalItems, totalPages]
  properties:
    items:
      type: array
      items: { $ref: "#/AdminProductListItem" }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 60 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
AdminProductMutationResult:
  type: object
  additionalProperties: false
  required: [product]
  properties:
    product: { $ref: "#/AdminProductDetail" }
    created: { type: boolean }
AdminProductDeleteResult:
  type: object
  additionalProperties: false
  required: [productId, deleted]
  properties:
    productId: { type: string, pattern: "^[1-9][0-9]*$" }
    deleted: { type: boolean, const: true }
AdminProductListResponseEnvelope:
  allOf:
    - { $ref: "./common.yaml#/SuccessEnvelope" }
    - type: object
      properties:
        data: { $ref: "#/AdminProductList" }
AdminProductDetailResponseEnvelope:
  allOf:
    - { $ref: "./common.yaml#/SuccessEnvelope" }
    - type: object
      properties:
        data: { $ref: "#/AdminProductDetail" }
AdminProductOptionsResponseEnvelope:
  allOf:
    - { $ref: "./common.yaml#/SuccessEnvelope" }
    - type: object
      properties:
        data: { $ref: "#/AdminProductOptions" }
AdminProductMutationResponseEnvelope:
  allOf:
    - { $ref: "./common.yaml#/SuccessEnvelope" }
    - type: object
      properties:
        data: { $ref: "#/AdminProductMutationResult" }
AdminProductDeleteResponseEnvelope:
  allOf:
    - { $ref: "./common.yaml#/SuccessEnvelope" }
    - type: object
      properties:
        data: { $ref: "#/AdminProductDeleteResult" }
