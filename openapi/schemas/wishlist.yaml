AddWishlistItemRequest:
  type: object
  additionalProperties: false
  required: [productId]
  properties:
    productId:
      type: string
      pattern: "^[1-9][0-9]*$"
      description: "BIGINT Product identifier. Customer ownership is derived exclusively from the JWT."
WishlistProduct:
  type: object
  additionalProperties: false
  required: [productId, name, slug, thumbnail, currentPrice, currency, availability]
  properties:
    productId: { type: string, pattern: "^[1-9][0-9]*$" }
    name: { type: [string, "null"] }
    slug: { type: [string, "null"] }
    thumbnail: { type: [string, "null"] }
    currentPrice: { type: [string, "null"], pattern: "^[0-9]+\\.[0-9]{2}$" }
    currency: { type: string, const: VND }
    availability:
      type: string
      enum: [AVAILABLE, LOW_STOCK, OUT_OF_STOCK, UNAVAILABLE]
WishlistItem:
  type: object
  additionalProperties: false
  required: [wishlistItemId, product, addedAt]
  properties:
    wishlistItemId: { type: string, pattern: "^[1-9][0-9]*$" }
    product: { $ref: "#/WishlistProduct" }
    addedAt: { type: string, format: date-time }
WishlistList:
  type: object
  additionalProperties: false
  required: [items, page, pageSize, totalItems, totalPages]
  properties:
    items:
      type: array
      items: { $ref: "#/WishlistItem" }
    page: { type: integer, minimum: 1 }
    pageSize: { type: integer, minimum: 1, maximum: 60 }
    totalItems: { type: integer, minimum: 0 }
    totalPages: { type: integer, minimum: 0 }
WishlistMutationResult:
  type: object
  additionalProperties: false
  required: [productId, deleted]
  properties:
    productId: { type: string, pattern: "^[1-9][0-9]*$" }
    deleted: { type: boolean, const: true }
WishlistListResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/WishlistList" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
WishlistItemResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/WishlistItem" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
WishlistMutationResponseEnvelope:
  type: object
  additionalProperties: false
  required: [success, status, message, data, metadata, requestId, traceId, contractVersion]
  properties:
    success: { type: boolean, const: true }
    status: { type: string, const: success }
    message: { type: string }
    data: { $ref: "#/WishlistMutationResult" }
    metadata: { $ref: "./common.yaml#/ResponseMetadata" }
    requestId: { type: string }
    traceId: { type: string }
    contractVersion: { type: string, const: v1 }
