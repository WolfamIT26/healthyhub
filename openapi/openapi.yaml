  /api/v1/auth/verify-email:
    post:
      operationId: "postAuthVerifyEmail"
      summary: "Xác minh email"
      description: |
        Xác minh email

        Ghi chú quyền: Token owner.
        Xác thực: Verification token.
        Rate limit: Áp dụng rate limit chặt cho xác thực để chống brute force.
