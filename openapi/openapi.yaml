        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/refresh:
    post:
      operationId: "postAuthRefresh"
      summary: "Lấy access token mới"
      description: |
        Lấy access token mới

        Ghi chú quyền: Session owner.
        Xác thực: Refresh token.
        Rate limit: Áp dụng rate limit chặt cho xác thực để chống brute force.
        Web dùng __Host-hh_refresh cookie cùng X-CSRF-Token; Mobile dùng X-Refresh-Token.
        Rotation xử lý atomically; không dùng idempotency key.
      tags:
        - "Authentication"
      security:
        - RefreshCookieAuth: []
          CsrfTokenAuth: []
        - RefreshTokenAuth: []
      x-permission: "Session owner"
      x-auth-level: "Refresh token"
      x-rate-limit-note: "Áp dụng rate limit chặt cho xác thực để chống brute force."
      x-idempotency-required: false
      x-source: ".spec/api/domains/authentication.md"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AcceptLanguageHeader"
      responses:
        "200":
          $ref: "#/components/responses/AuthRefreshOk"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "409":
