openapi: 3.1.0
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "HealthyHub API Specification"
  description: |
    OpenAPI Specification cho HealthyHub, được sinh từ API Specification và Data Contract hiện có.
    Tài liệu này chỉ mô tả contract API, schema, response, security và webhook. Không chứa code backend, frontend, migration hoặc logic nghiệp vụ.
  version: "1.1.0"
servers:
  - url: "/"
    description: "Relative server. Tất cả endpoint giữ nguyên prefix /api/v1 theo API Specification."
security:
  - BearerAuth: []
tags:
  - name: "Authentication"
    description: "Xác thực, phiên đăng nhập và bảo vệ tài khoản."
  - name: "User"
    description: "Tài khoản, vai trò và quyền hệ thống."
  - name: "Customer"
    description: "Hồ sơ khách hàng và địa chỉ giao hàng."
  - name: "Staff"
    description: "Hồ sơ nhân sự và hoạt động nội bộ."
  - name: "Product"
    description: "Sản phẩm healthy, media và nhập xuất dữ liệu sản phẩm."
  - name: "Category"
    description: "Danh mục sản phẩm và cây danh mục."
  - name: "Brand"
    description: "Thương hiệu sản phẩm."
  - name: "Inventory"
    description: "Tồn kho, biến động kho và cảnh báo tồn."
  - name: "Cart"
    description: "Giỏ hàng khách hàng và khách vãng lai."
  - name: "Wishlist"
    description: "Danh sách sản phẩm yêu thích."
  - name: "Order"
    description: "Đơn hàng, xác nhận, hủy và timeline xử lý."
  - name: "Payment"
    description: "Thanh toán, giao dịch và hoàn tiền."
  - name: "Shipping"
    description: "Báo giá vận chuyển, vận đơn và tracking."
  - name: "Coupon"
    description: "Mã giảm giá và lịch sử sử dụng."
  - name: "Promotion"
    description: "Chiến dịch khuyến mãi."
  - name: "Loyalty"
    description: "Điểm thành viên và hạng khách hàng."
  - name: "Review"
    description: "Đánh giá sản phẩm và kiểm duyệt."
  - name: "Blog"
    description: "Nội dung blog và media bài viết."
  - name: "Media"
    description: "Tải lên, quản lý và tải xuống media."
  - name: "Notification"
    description: "Thông báo, template và webhook nhà cung cấp."
  - name: "Analytics"
    description: "Phân tích kinh doanh và tracking event."
  - name: "AI"
    description: "Tính năng AI toàn hệ thống qua AI Gateway."
  - name: "Settings"
    description: "Cấu hình hệ thống, bảo mật, feature flag và tích hợp."
paths:
  /api/v1/auth/register:
    post:
      operationId: "postAuthRegister"
      summary: "Đăng ký tài khoản khách hàng"
      description: |
        Đăng ký tài khoản khách hàng

        Ghi chú quyền: Public.
        Xác thực: Public.
        Rate limit: Áp dụng rate limit chặt cho xác thực để chống brute force.
        Idempotency: X-Idempotency-Key được khuyến nghị, không bắt buộc.
      tags:
        - "Authentication"
      security: []
      x-permission: "Public"
      x-auth-level: "Public"
      x-rate-limit-note: "Áp dụng rate limit chặt cho xác thực để chống brute force."
      x-idempotency-required: false
      x-source: ".spec/api/domains/authentication.md"
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TraceIdHeader"
        - $ref: "#/components/parameters/AcceptLanguageHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          $ref: "#/components/responses/AuthRegisterCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      operationId: "postAuthLogin"
      summary: "Đăng nhập customer/staff"
      description: |
        Đăng nhập customer/staff

        Ghi chú quyền: Public.
        Xác thực: Public.
        Rate limit: Áp dụng rate limit chặt cho xác thực để chống brute force.
        Idempotency: không bắt buộc cho thao tác đọc.
      tags:
        - "Authentication"
      security: []
      x-permission: "Public"
      x-auth-level: "Public"
