      description: |
        Đăng xuất session hiện tại

        Ghi chú quyền: Session owner.
        Xác thực: JWT.
        Rate limit: Áp dụng rate limit chặt cho xác thực để chống brute force.
        Idempotency: endpoint idempotent; không cần idempotency key.
      tags:
        - "Authentication"
      security:
