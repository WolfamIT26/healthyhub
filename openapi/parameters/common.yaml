RequestIdHeader:
  name: X-Request-Id
  in: header
  required: false
  description: "Mã request do client truyền vào để đối soát log."
  schema:
    type: string
TraceIdHeader:
  name: X-Trace-Id
  in: header
  required: false
  description: "Mã trace cho distributed tracing."
  schema:
    type: string
AcceptLanguageHeader:
  name: Accept-Language
  in: header
  required: false
  description: "Ngôn ngữ phản hồi mong muốn."
  schema:
    type: string
    enum: [vi-VN, en-US]
IdempotencyKeyHeader:
  name: X-Idempotency-Key
  in: header
  required: false
  description: "Khóa chống xử lý lặp cho thao tác ghi, thanh toán, webhook hoặc AI tốn chi phí."
  schema:
    type: string
PageParam:
  name: page
  in: query
  required: false
  description: "Trang hiện tại, bắt đầu từ 1."
  schema:
    type: integer
    minimum: 1
    default: 1
PageSizeParam:
  name: pageSize
  in: query
  required: false
  description: "Số bản ghi mỗi trang."
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
QParam:
  name: q
  in: query
  required: false
  description: "Từ khóa tìm kiếm."
  schema:
    type: string
SortParam:
  name: sort
  in: query
  required: false
  description: "Chuỗi sort dạng field:direction, ví dụ createdAt:desc."
  schema:
    type: string
FilterParam:
  name: filter
  in: query
  required: false
  description: "Filter dạng chuỗi quy ước theo Data Contract."
  schema:
    type: string
PaymentIdQuery:
  name: paymentId
  in: query
  required: false
  description: "Payment nội bộ dùng cho điều hướng Return; backend vẫn resolve bằng vnp_TxnRef đã ký."
  schema:
    type: string
VnpayTmnCodeQuery:
  name: vnp_TmnCode
  in: query
  required: true
  description: "Mã terminal VNPAY; phải khớp terminal backend đã cấu hình."
  schema:
    type: string
    pattern: "^[A-Za-z0-9]{8}$"
VnpayAmountQuery:
  name: vnp_Amount
  in: query
  required: true
  description: "Số tiền VND do VNPAY trả về ở đơn vị nhân 100; backend đối chiếu Order đã persist."
  schema:
    type: string
    pattern: "^\\d{1,12}$"
VnpayResponseCodeQuery:
  name: vnp_ResponseCode
  in: query
  required: true
  description: "Mã kết quả giao dịch VNPAY."
  schema:
    type: string
    pattern: "^\\d{2}$"
VnpayTransactionStatusQuery:
  name: vnp_TransactionStatus
  in: query
  required: true
  description: "Trạng thái giao dịch VNPAY."
  schema:
    type: string
    pattern: "^\\d{2}$"
VnpayTransactionNoQuery:
  name: vnp_TransactionNo
  in: query
  required: true
  description: "Mã giao dịch do VNPAY ghi nhận."
  schema:
    type: string
    pattern: "^\\d{1,15}$"
VnpayTxnRefQuery:
  name: vnp_TxnRef
  in: query
  required: true
  description: "Tham chiếu payment attempt đã gửi sang VNPAY."
  schema:
    type: string
    pattern: "^[A-Za-z0-9]{1,100}$"
VnpaySecureHashQuery:
  name: vnp_SecureHash
  in: query
  required: true
  description: "Checksum HMAC do VNPAY gửi; chỉ backend xác minh và không persist giá trị raw."
  schema:
    type: string
    pattern: "^[A-Fa-f0-9]{32,256}$"
DateFromParam:
  name: dateFrom
  in: query
  required: false
  description: "Mốc bắt đầu theo ISO 8601."
  schema:
    type: string
    format: date-time
DateToParam:
  name: dateTo
  in: query
  required: false
  description: "Mốc kết thúc theo ISO 8601."
  schema:
    type: string
    format: date-time
