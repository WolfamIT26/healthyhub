RequestIdHeader:
  name: X-Request-Id
  in: header
  required: false
  description: "Mã request do client truyền vào để đối soát log."
  schema:
    type: string
TraceIdHeader:
  name: X-Trace-Id
  in: header
  required: false
  description: "Mã trace cho distributed tracing."
  schema:
    type: string
AcceptLanguageHeader:
  name: Accept-Language
  in: header
  required: false
  description: "Ngôn ngữ phản hồi mong muốn."
  schema:
    type: string
    enum: [vi-VN, en-US]
IdempotencyKeyHeader:
  name: X-Idempotency-Key
  in: header
  required: false
  description: "Khóa chống xử lý lặp cho thao tác ghi, thanh toán, webhook hoặc AI tốn chi phí."
  schema:
    type: string
PageParam:
  name: page
  in: query
  required: false
  description: "Trang hiện tại, bắt đầu từ 1."
  schema:
    type: integer
    minimum: 1
    default: 1
PageSizeParam:
  name: pageSize
  in: query
  required: false
  description: "Số bản ghi mỗi trang."
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
QParam:
  name: q
  in: query
  required: false
  description: "Từ khóa tìm kiếm."
  schema:
    type: string
SortParam:
  name: sort
  in: query
  required: false
  description: "Chuỗi sort dạng field:direction, ví dụ createdAt:desc."
  schema:
    type: string
FilterParam:
  name: filter
  in: query
  required: false
  description: "Filter dạng chuỗi quy ước theo Data Contract."
  schema:
    type: string
DateFromParam:
  name: dateFrom
  in: query
  required: false
  description: "Mốc bắt đầu theo ISO 8601."
  schema:
    type: string
    format: date-time
DateToParam:
  name: dateTo
  in: query
  required: false
  description: "Mốc kết thúc theo ISO 8601."
  schema:
    type: string
    format: date-time
